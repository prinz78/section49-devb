<!-- Une rangée pour organiser les cartes -->
<div class="row">
    <!-- Première carte visible -->
    <div class="col-md-4">
        <div class="card">
            <img src="..." class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Article 1</h5>
                <p class="card-text">Un résumé de l'article.</p>
                <!-- Le bouton est à l'intérieur de la carte -->
            </div>
        </div>
    </div>

    <!-- Zone de contenu supplémentaire qui sera cachée au départ -->
    <!-- L'ID 'contenuCache' est essentiel pour le lien avec le bouton -->
    <div class="col-12 collapse" id="contenuCache">
        <div class="row">
            <!-- Les cartes supplémentaires apparaissent ici -->
            <div class="col-md-4">
                <div class="card">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Article 4</h5>
                        <p class="card-text">Ce contenu était caché.</p>
                    </div>
                </div>
            </div>
            <!-- Ajoute d'autres cartes ici -->
        </div>
    </div>
</div>

<!-- Le bouton qui contrôle l'affichage, placé en bas -->
<div class="text-center">
    <a class="btn btn-primary" data-bs-toggle="collapse" href="#contenuCache" role="button" aria-expanded="false" aria-controls="contenuCache">
        Voir plus d'articles
    </a>
</div>
